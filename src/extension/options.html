<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Twimarkの設定</title>
    <link rel="stylesheet" href="ui.css" />
    <style>main { max-width: 520px; }</style>
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <main>
      <h1>Twimarkの設定</h1>
      <form data-form>
        <label>トークン（fine-grained personal access token）<input class="d-input" name="token" type="password" required autocomplete="off" /></label>
        <p class="note">トークンはこのブラウザの拡張機能の保存領域にだけ置かれます。対象を Twimark リポジトリだけにし、権限は「Contents」の読み取りと書き込みだけ、期限付きにしてください。</p>
        <p class="msg" role="status" data-status></p>
        <div class="actions">
          <button type="button" class="d-btn" data-test>接続を確かめる</button>
          <button type="submit" class="d-btn primary">保存</button>
        </div>
      </form>
    </main>
  </body>
</html>
