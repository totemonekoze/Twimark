<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Twimarkの設定</title>
    <link rel="stylesheet" href="ui.css" />
    <style>main { max-width: 520px; }</style>
    <script type="module" src="options.js"></script>
  </head>
  <body>
    <main>
      <h1>Twimarkの設定</h1>
      <form data-form>
        <label>トークン<input class="d-input" name="token" type="password" required autocomplete="off" /></label>
        <p class="note">Twimark の一覧の画面にログインし、「設定」の「拡張・アプリのトークン」で発行したものを入れます。この拡張機能の保存領域にだけ置かれます。要らなくなったら一覧の画面で取り消してください。</p>
        <p class="msg" role="status" data-status></p>
        <div class="actions">
          <button type="button" class="d-btn" data-test>接続を確かめる</button>
          <button type="submit" class="d-btn primary">保存</button>
        </div>
      </form>
    </main>
  </body>
</html>
